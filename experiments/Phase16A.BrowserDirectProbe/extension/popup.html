<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media Lock Phase 16A Probe</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Browser Direct Probe</h1>
      <p>Commands target only the active YouTube or YouTube Music top-level tab.</p>
      <div class="actions">
        <button type="button" data-command="play">Play</button>
        <button type="button" data-command="pause">Pause</button>
      </div>
      <label for="seek-seconds">Seek position (seconds)</label>
      <div class="seek-row">
        <input id="seek-seconds" type="number" min="0" step="0.1" value="30">
        <button id="seek" type="button">Seek</button>
      </div>
      <p id="status" role="status" aria-live="polite">Ready.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
